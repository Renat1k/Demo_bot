services:
  - type: web
    name: naikrashcha-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    # SQLite на free-плані тимчасова. Для production потрібен paid instance
    # із persistent disk, наприклад mountPath: /var/data та DB_PATH=/var/data/bot.db.
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
